<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bracket de Torneo Interactivo (32 Participantes)</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #07090e;
            --bg-card: rgba(15, 23, 42, 0.75);
            --bg-card-hover: rgba(30, 41, 59, 0.85);
            --bg-input: rgba(15, 23, 42, 0.9);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(99, 102, 241, 0.4);
            
            --accent-primary: #6366f1;
            --accent-primary-glow: rgba(99, 102, 241, 0.35);
            --accent-cyan: #06b6d4;
            --accent-cyan-glow: rgba(6, 182, 212, 0.35);
            --accent-gold: #f59e0b;
            --accent-gold-glow: rgba(245, 158, 11, 0.4);
            --accent-green: #10b981;
            --accent-red: #ef4444;

            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;

            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-sm: 6px;

            --font-heading: 'Outfit', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(6, 182, 212, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.5) 0%, transparent 100%);
            background-attachment: fixed;
        }

        /* Header Bar */
        header {
            background: rgba(10, 15, 29, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 0.8rem 1.5rem;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-cyan));
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px var(--accent-primary-glow);
            flex-shrink: 0;
        }

        .brand-icon svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: white;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .title-input-container {
            display: flex;
            flex-direction: column;
        }

        .tournament-title-input {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-main);
            font-family: var(--font-heading);
            font-size: 1.4rem;
            font-weight: 700;
            padding: 0.2rem 0.4rem;
            border-radius: var(--radius-sm);
            transition: all 0.2s ease;
            outline: none;
            max-width: 320px;
        }

        .tournament-title-input:hover, .tournament-title-input:focus {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--border-color);
        }

        .subtitle-badge-row {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding-left: 0.4rem;
        }

        .subtitle {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Save Status Indicator */
        .save-status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.72rem;
            color: var(--accent-green);
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            font-weight: 600;
        }
        .pulse-dot {
            width: 7px;
            height: 7px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.25); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.7; }
        }

        /* Action Buttons Toolbar */
        .actions-toolbar {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .btn {
            background: rgba(30, 41, 59, 0.7);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.55rem 0.95rem;
            border-radius: var(--radius-md);
            font-family: var(--font-body);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s ease;
            backdrop-filter: blur(8px);
            user-select: none;
            white-space: nowrap;
        }

        .btn:hover {
            background: rgba(51, 65, 85, 0.9);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), #4f46e5);
            border: none;
            box-shadow: 0 0 15px var(--accent-primary-glow);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #4f46e5, #4338ca);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
        }

        .btn-cyan {
            background: linear-gradient(135deg, var(--accent-cyan), #0891b2);
            border: none;
            box-shadow: 0 0 15px var(--accent-cyan-glow);
        }

        .btn-cyan:hover {
            background: linear-gradient(135deg, #0891b2, #0e7490);
        }

        .btn svg {
            width: 15px;
            height: 15px;
            stroke-width: 2.2;
        }

        /* Mobile/Tablet Round Nav Tabs */
        .round-nav-bar {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1rem;
            background: rgba(15, 23, 42, 0.9);
            border-bottom: 1px solid var(--border-color);
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: thin;
            width: 100%;
        }

        .round-nav-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-right: 0.3rem;
        }

        .round-tab-btn {
            background: rgba(30, 41, 59, 0.6);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 0.4rem 0.85rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .round-tab-btn:hover, .round-tab-btn.active {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
            box-shadow: 0 0 12px var(--accent-primary-glow);
        }

        .tab-badge {
            background: rgba(255, 255, 255, 0.15);
            padding: 0.1rem 0.4rem;
            border-radius: 10px;
            font-size: 0.7rem;
        }

        /* Main Workspace */
        main {
            flex: 1;
            padding: 1rem 0.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            position: relative;
        }

        /* Bracket Viewport Container */
        .bracket-viewport {
            width: 100%;
            overflow-x: auto;
            overflow-y: auto;
            padding: 3rem 1.5rem 3rem 1.5rem;
            display: flex;
            justify-content: flex-start;
            min-height: calc(100vh - 180px);
            scrollbar-width: thin;
            scrollbar-color: var(--accent-primary) var(--bg-dark);
            -webkit-overflow-scrolling: touch;
        }

        .bracket-viewport::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }
        .bracket-viewport::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
            border-radius: 4px;
        }
        .bracket-viewport::-webkit-scrollbar-thumb {
            background: var(--accent-primary);
            border-radius: 4px;
        }

        /* Bracket Tree Container */
        .bracket-tree {
            display: flex;
            gap: 3.5rem;
            align-items: stretch;
            position: relative;
            margin: auto 0;
            padding: 0 0.5rem;
        }

        /* Round Column */
        .bracket-round {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            min-width: 240px;
            position: relative;
            scroll-margin-left: 2rem;
        }

        .round-header {
            position: absolute;
            top: -45px;
            left: 0;
            right: 0;
            text-align: center;
            font-family: var(--font-heading);
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--accent-cyan);
            background: rgba(15, 23, 42, 0.7);
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            border: 1px solid rgba(6, 182, 212, 0.25);
            backdrop-filter: blur(6px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        /* Match Card */
        .match-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            position: relative;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            width: 240px;
            margin: 0.8rem 0;
        }

        .match-card:hover {
            border-color: var(--border-highlight);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.68rem;
            color: var(--text-dim);
            padding: 0 0.3rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .participant-row {
            display: flex;
            align-items: center;
            background: rgba(10, 15, 26, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: var(--radius-sm);
            padding: 0.4rem 0.6rem;
            gap: 0.5rem;
            transition: all 0.2s ease;
            cursor: pointer;
            user-select: none;
            position: relative;
        }

        .participant-row:hover {
            background: rgba(30, 41, 59, 0.6);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .participant-row.winner {
            background: rgba(16, 185, 129, 0.15);
            border-color: rgba(16, 185, 129, 0.4);
            box-shadow: inset 0 0 10px rgba(16, 185, 129, 0.1);
        }

        .participant-row.winner .participant-name-input {
            color: #6ee7b7;
            font-weight: 700;
        }

        .participant-row.winner .score-input {
            color: #6ee7b7;
            font-weight: 700;
        }

        .participant-name-input {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: var(--font-body);
            font-size: 0.85rem;
            font-weight: 500;
            flex: 1;
            outline: none;
            width: 100%;
        }

        .participant-name-input:focus {
            color: #ffffff;
            font-weight: 600;
        }

        .score-input {
            width: 32px;
            height: 28px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-main);
            text-align: center;
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .score-input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 8px var(--accent-primary-glow);
        }

        .win-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            border-radius: 4px;
            padding: 0.25rem 0.4rem;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .win-btn:hover {
            background: var(--accent-green);
            color: white;
            border-color: var(--accent-green);
        }

        .participant-row.winner .win-btn {
            background: var(--accent-green);
            color: white;
            border-color: var(--accent-green);
        }

        /* SVG Connectors Overlay */
        .connectors-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .connector-line {
            fill: none;
            stroke: rgba(255, 255, 255, 0.12);
            stroke-width: 2;
            transition: stroke 0.3s ease, stroke-width 0.3s ease;
        }

        .connector-line.active {
            stroke: var(--accent-cyan);
            stroke-width: 2.5;
            filter: drop-shadow(0 0 6px var(--accent-cyan-glow));
        }

        /* Champion Box / Trophy Stage */
        .champion-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: linear-gradient(145deg, rgba(245, 158, 11, 0.15), rgba(15, 23, 42, 0.9));
            border: 2px solid rgba(245, 158, 11, 0.4);
            border-radius: var(--radius-lg);
            box-shadow: 0 0 40px rgba(245, 158, 11, 0.25);
            width: 250px;
            text-align: center;
            margin: auto 0;
            animation: pulseGlow 3s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 25px rgba(245, 158, 11, 0.2); }
            100% { box-shadow: 0 0 50px rgba(245, 158, 11, 0.45); }
        }

        .trophy-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #f59e0b, #fbbf24);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.8rem;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.6);
        }

        .trophy-icon svg {
            width: 36px;
            height: 36px;
            fill: #78350f;
        }

        .champion-title {
            font-family: var(--font-heading);
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent-gold);
            font-weight: 800;
            margin-bottom: 0.3rem;
        }

        .champion-name {
            font-family: var(--font-heading);
            font-size: 1.4rem;
            font-weight: 800;
            color: #ffffff;
            word-break: break-word;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(10px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 520px;
            padding: 2rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-title {
            font-family: var(--font-heading);
            font-size: 1.3rem;
            font-weight: 700;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            line-height: 1;
        }

        .close-btn:hover {
            color: white;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
        }

        .form-select, .form-textarea {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-main);
            padding: 0.75rem 1rem;
            font-family: var(--font-body);
            font-size: 0.9rem;
            outline: none;
        }

        .form-select:focus, .form-textarea:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 10px var(--accent-primary-glow);
        }

        .form-textarea {
            height: 140px;
            resize: vertical;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        /* Canvas Confetti */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 300;
        }

        /* Mobile Breakpoints & Responsive Enhancements */
        @media (max-width: 900px) {
            header {
                padding: 0.75rem 1rem;
                flex-direction: column;
                align-items: stretch;
            }

            .brand-container {
                justify-content: space-between;
                width: 100%;
            }

            .tournament-title-input {
                max-width: 100%;
                font-size: 1.2rem;
            }

            .actions-toolbar {
                justify-content: flex-start;
                gap: 0.4rem;
                overflow-x: auto;
                padding-bottom: 0.3rem;
            }

            .btn {
                padding: 0.45rem 0.75rem;
                font-size: 0.78rem;
            }

            .bracket-viewport {
                padding: 2.5rem 0.5rem 2rem 0.5rem;
            }

            .bracket-tree {
                gap: 2rem;
            }

            .bracket-round {
                min-width: 210px;
            }

            .match-card {
                width: 210px;
            }
        }

        @media print {
            header, .actions-toolbar, .btn, .round-nav-bar {
                display: none !important;
            }
            body {
                background: white !important;
                color: black !important;
            }
            .match-card {
                background: #f8fafc !important;
                border: 1px solid #cbd5e1 !important;
                box-shadow: none !important;
            }
            .participant-row {
                background: #ffffff !important;
                border: 1px solid #e2e8f0 !important;
            }
            .participant-name-input {
                color: #0f172a !important;
            }
            .connector-line {
                stroke: #94a3b8 !important;
            }
        }
    </style>
</head>
<body>

    <!-- Canvas for Confetti Fireworks -->
    <canvas id="confetti-canvas"></canvas>

    <!-- Header Toolbar -->
    <header>
        <div class="brand-container">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
                    <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
                    <path d="M4 22h16"></path>
                    <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path>
                    <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path>
                    <path d="M18 2H6v7a6 6 0 0 0 12 0V2z"></path>
                </svg>
            </div>
            <div class="title-input-container">
                <input type="text" id="tournament-name" class="tournament-title-input" value="Torneo de Campeones 2026" spellcheck="false">
                <div class="subtitle-badge-row">
                    <span class="subtitle">32 Participantes</span>
                    <div class="save-status-badge">
                        <span class="pulse-dot"></span>
                        <span>Auto-guardado JSON activo</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="actions-toolbar">
            <button class="btn btn-primary" onclick="openNewTournamentModal()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Nuevo Torneo
            </button>
            <button class="btn" onclick="shuffleParticipants()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
                Mezclar Semillas
            </button>
            <button class="btn" onclick="resetScores()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
                Reiniciar Marcadores
            </button>
            <button class="btn btn-cyan" onclick="exportJSON()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Descargar JSON
            </button>
            <button class="btn" onclick="importJSONPrompt()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                Cargar JSON
            </button>
            <button class="btn" onclick="window.print()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                Imprimir
            </button>
        </div>
    </header>

    <!-- Quick Navigation Round Pills for Mobile / Desktop -->
    <nav class="round-nav-bar" id="round-nav-bar">
        <span class="round-nav-label">Ir a ronda:</span>
        <div id="round-tabs-container" style="display: inline-flex; gap: 0.4rem;">
            <!-- Rendered by JS -->
        </div>
    </nav>

    <!-- Main Bracket Workspace -->
    <main>
        <div class="bracket-viewport" id="bracket-viewport">
            <svg class="connectors-svg" id="connectors-svg"></svg>
            <div class="bracket-tree" id="bracket-tree">
                <!-- Round columns dynamically generated by JavaScript -->
            </div>
        </div>
    </main>

    <!-- New Tournament Modal -->
    <div class="modal-overlay" id="new-tournament-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title">Configurar Nuevo Torneo</h3>
                <button class="close-btn" onclick="closeNewTournamentModal()">&times;</button>
            </div>
            <div class="form-group">
                <label class="form-label">Número de Participantes</label>
                <select id="size-select" class="form-select">
                    <option value="4">4 Participantes (Semifinales y Final)</option>
                    <option value="8">8 Participantes (Cuartos de Final)</option>
                    <option value="16">16 Participantes (Octavos de Final)</option>
                    <option value="32" selected>32 Participantes (Dieciseisavos)</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Lista de Participantes (Uno por línea)</label>
                <textarea id="participants-textarea" class="form-textarea" placeholder="Equipo 1&#10;Equipo 2&#10;...&#10;Equipo 32"></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn" onclick="closeNewTournamentModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="generateNewTournament()">Generar Bracket</button>
            </div>
        </div>
    </div>

    <!-- Hidden file input for importing JSON -->
    <input type="file" id="file-input" style="display: none;" accept=".json" onchange="handleFileImport(event)">

    <script>
        // State Storage & Configuration
        let tournamentData = {
            title: "Torneo de Campeones 2026",
            size: 32,
            last_updated: null,
            champion: null,
            participants: [],
            progression: {},
            rounds: []
        };

        // Round Name Labels Mapping
        function getRoundName(roundIndex, totalRounds) {
            const roundsFromFinal = totalRounds - roundIndex;
            if (roundsFromFinal === 1) return "Gran Final";
            if (roundsFromFinal === 2) return "Semifinales";
            if (roundsFromFinal === 3) return "Cuartos de Final";
            if (roundsFromFinal === 4) return "Octavos de Final";
            if (roundsFromFinal === 5) return "Dieciseisavos";
            return `Ronda ${roundIndex + 1}`;
        }

        // Initialize default state
        function initDefaultTournament(size = 32, customParticipants = null) {
            tournamentData.size = parseInt(size);
            tournamentData.title = document.getElementById('tournament-name').value || "Torneo de Campeones 2026";
            tournamentData.champion = null;
            
            // Populate participant list
            tournamentData.participants = [];
            for (let i = 0; i < tournamentData.size; i++) {
                if (customParticipants && customParticipants[i] && customParticipants[i].trim() !== '') {
                    tournamentData.participants.push(customParticipants[i].trim());
                } else {
                    tournamentData.participants.push(`Equipo ${i + 1}`);
                }
            }

            const totalRounds = Math.log2(tournamentData.size);
            tournamentData.rounds = [];

            // Build structure for each round
            let currentMatchesCount = tournamentData.size / 2;
            for (let r = 0; r < totalRounds; r++) {
                let roundMatches = [];
                for (let m = 0; m < currentMatchesCount; m++) {
                    let team1 = "";
                    let team2 = "";

                    if (r === 0) {
                        team1 = tournamentData.participants[m * 2] || "";
                        team2 = tournamentData.participants[m * 2 + 1] || "";
                    }

                    roundMatches.push({
                        id: `r${r}_m${m}`,
                        team1: team1,
                        team2: team2,
                        score1: "",
                        score2: "",
                        winner: null
                    });
                }
                tournamentData.rounds.push(roundMatches);
                currentMatchesCount /= 2;
            }

            updateProgressionSummary();
            saveToLocalStorage();
            renderBracket();
            renderRoundNavTabs();
        }

        // Compute Live Advancing Teams Summary
        function updateProgressionSummary() {
            tournamentData.last_updated = new Date().toISOString();
            
            const totalRounds = tournamentData.rounds.length;
            const summary = {
                dieciseisavos: [],
                octavos: [],
                cuartos: [],
                semifinales: [],
                finalistas: [],
                campeon: null
            };

            tournamentData.rounds.forEach((round, rIndex) => {
                const roundName = getRoundName(rIndex, totalRounds).toLowerCase();
                const advancingInThisRound = [];

                round.forEach(m => {
                    if (m.winner === 1 && m.team1) advancingInThisRound.push(m.team1);
                    if (m.winner === 2 && m.team2) advancingInThisRound.push(m.team2);
                });

                if (rIndex === 0) {
                    summary.dieciseisavos = tournamentData.participants.slice();
                }
                if (roundName.includes("octavos")) summary.octavos = advancingInThisRound;
                if (roundName.includes("cuartos")) summary.cuartos = advancingInThisRound;
                if (roundName.includes("semifinales")) summary.semifinales = advancingInThisRound;
                if (roundName.includes("final")) summary.finalistas = advancingInThisRound;
            });

            // Grand Final Winner
            const finalMatch = tournamentData.rounds[totalRounds - 1][0];
            if (finalMatch.winner === 1 && finalMatch.team1) summary.campeon = finalMatch.team1;
            else if (finalMatch.winner === 2 && finalMatch.team2) summary.campeon = finalMatch.team2;
            else summary.campeon = null;

            tournamentData.champion = summary.campeon;
            tournamentData.progression = summary;
        }

        // Save to Browser LocalStorage in Real Time
        function saveToLocalStorage() {
            try {
                updateProgressionSummary();
                localStorage.setItem('interactive_tournament_bracket', JSON.stringify(tournamentData));
            } catch(e) {
                console.error("Storage error:", e);
            }
        }

        // Load from Browser LocalStorage if available
        function loadFromLocalStorage() {
            try {
                const saved = localStorage.getItem('interactive_tournament_bracket');
                if (saved) {
                    const parsedData = JSON.parse(saved);
                    if (parsedData && parsedData.size === 32 && parsedData.rounds && parsedData.rounds.length === 5) {
                        tournamentData = parsedData;
                        document.getElementById('tournament-name').value = tournamentData.title || "Torneo de Campeones 2026";
                        renderBracket();
                        renderRoundNavTabs();
                        return true;
                    } else {
                        localStorage.removeItem('interactive_tournament_bracket');
                    }
                }
            } catch(e) {
                console.error("Error loading saved state:", e);
            }
            return false;
        }

        // Render Round Navigation Tabs
        function renderRoundNavTabs() {
            const container = document.getElementById('round-tabs-container');
            container.innerHTML = '';

            const totalRounds = tournamentData.rounds.length;

            tournamentData.rounds.forEach((round, rIndex) => {
                const btn = document.createElement('button');
                btn.className = 'round-tab-btn';
                const name = getRoundName(rIndex, totalRounds);
                btn.innerHTML = `${name} <span class="tab-badge">${round.length}</span>`;
                btn.onclick = () => scrollToRound(rIndex);
                container.appendChild(btn);
            });

            // Champion Tab
            const champBtn = document.createElement('button');
            champBtn.className = 'round-tab-btn';
            champBtn.innerHTML = `🏆 Campeón`;
            champBtn.onclick = () => scrollToChampion();
            container.appendChild(champBtn);

            // View All Tab
            const allBtn = document.createElement('button');
            allBtn.className = 'round-tab-btn active';
            allBtn.innerHTML = `🌐 Ver Todo`;
            allBtn.onclick = () => scrollToStart();
            container.appendChild(allBtn);
        }

        function scrollToRound(roundIndex) {
            const roundCol = document.querySelector(`.bracket-round[data-round="${roundIndex}"]`);
            if (roundCol) {
                roundCol.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
        }

        function scrollToChampion() {
            const stage = document.querySelector('.champion-stage');
            if (stage) {
                stage.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
        }

        function scrollToStart() {
            const viewport = document.getElementById('bracket-viewport');
            viewport.scrollTo({ left: 0, behavior: 'smooth' });
        }

        // Render entire Bracket DOM structure
        function renderBracket() {
            const treeContainer = document.getElementById('bracket-tree');
            treeContainer.innerHTML = '';

            const totalRounds = tournamentData.rounds.length;

            tournamentData.rounds.forEach((roundMatches, roundIndex) => {
                const roundCol = document.createElement('div');
                roundCol.className = 'bracket-round';
                roundCol.dataset.round = roundIndex;

                const roundHeader = document.createElement('div');
                roundHeader.className = 'round-header';
                roundHeader.innerText = getRoundName(roundIndex, totalRounds);
                roundCol.appendChild(roundHeader);

                roundMatches.forEach((match, matchIndex) => {
                    const matchCard = document.createElement('div');
                    matchCard.className = 'match-card';
                    matchCard.id = `card_${match.id}`;

                    const matchHeader = document.createElement('div');
                    matchHeader.className = 'match-header';
                    matchHeader.innerHTML = `<span>Partido ${matchIndex + 1}</span>`;
                    matchCard.appendChild(matchHeader);

                    // Team 1 Row
                    const row1 = createParticipantRow(roundIndex, matchIndex, 1, match.team1, match.score1, match.winner === 1);
                    // Team 2 Row
                    const row2 = createParticipantRow(roundIndex, matchIndex, 2, match.team2, match.score2, match.winner === 2);

                    matchCard.appendChild(row1);
                    matchCard.appendChild(row2);
                    roundCol.appendChild(matchCard);
                });

                treeContainer.appendChild(roundCol);
            });

            // Add Champion Stage Box
            const finalMatch = tournamentData.rounds[totalRounds - 1][0];
            const championStage = document.createElement('div');
            championStage.className = 'champion-stage';
            
            let champName = tournamentData.champion || "???";

            championStage.innerHTML = `
                <div class="trophy-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
                        <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
                        <path d="M4 22h16"></path>
                        <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path>
                        <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path>
                        <path d="M18 2H6v7a6 6 0 0 0 12 0V2z"></path>
                    </svg>
                </div>
                <div class="champion-title">CAMPEÓN</div>
                <div class="champion-name" id="champion-display-name">${champName}</div>
            `;
            treeContainer.appendChild(championStage);

            requestAnimationFrame(() => {
                drawConnectors();
            });
        }

        // Helper to construct individual team/player row
        function createParticipantRow(roundIndex, matchIndex, teamNum, teamName, score, isWinner) {
            const row = document.createElement('div');
            row.className = `participant-row ${isWinner ? 'winner' : ''}`;

            const nameInput = document.createElement('input');
            nameInput.type = 'text';
            nameInput.className = 'participant-name-input';
            nameInput.value = teamName;
            nameInput.placeholder = `Equipo ${teamNum}`;
            
            nameInput.onchange = (e) => {
                updateTeamName(roundIndex, matchIndex, teamNum, e.target.value);
            };

            const scoreInput = document.createElement('input');
            scoreInput.type = 'text';
            scoreInput.className = 'score-input';
            scoreInput.value = score;
            scoreInput.placeholder = '-';
            scoreInput.onclick = (e) => e.stopPropagation();
            scoreInput.onchange = (e) => {
                updateScore(roundIndex, matchIndex, teamNum, e.target.value);
            };

            const winBtn = document.createElement('button');
            winBtn.className = 'win-btn';
            winBtn.title = 'Marcar como ganador';
            winBtn.innerHTML = '&#10003;';
            winBtn.onclick = (e) => {
                e.stopPropagation();
                selectWinner(roundIndex, matchIndex, teamNum);
            };

            row.appendChild(nameInput);
            row.appendChild(scoreInput);
            row.appendChild(winBtn);

            row.onclick = () => {
                if (teamName.trim() !== "") {
                    selectWinner(roundIndex, matchIndex, teamNum);
                }
            };

            return row;
        }

        // Update Team Name
        function updateTeamName(roundIndex, matchIndex, teamNum, newName) {
            const match = tournamentData.rounds[roundIndex][matchIndex];
            if (teamNum === 1) match.team1 = newName;
            else match.team2 = newName;

            // Also update master participant list if in round 0
            if (roundIndex === 0) {
                const participantIdx = matchIndex * 2 + (teamNum - 1);
                tournamentData.participants[participantIdx] = newName;
            }

            if (match.winner === teamNum) {
                propagateWinnerToNextRound(roundIndex, matchIndex, newName);
            }

            saveToLocalStorage();
            renderBracket();
        }

        // Update Score
        function updateScore(roundIndex, matchIndex, teamNum, value) {
            const match = tournamentData.rounds[roundIndex][matchIndex];
            if (teamNum === 1) match.score1 = value;
            else match.score2 = value;

            const s1 = parseInt(match.score1);
            const s2 = parseInt(match.score2);

            if (!isNaN(s1) && !isNaN(s2)) {
                if (s1 > s2) selectWinner(roundIndex, matchIndex, 1, false);
                else if (s2 > s1) selectWinner(roundIndex, matchIndex, 2, false);
            } else {
                saveToLocalStorage();
            }
        }

        // Select Match Winner
        function selectWinner(roundIndex, matchIndex, winnerTeamNum, triggerConfettiOnFinal = true) {
            const match = tournamentData.rounds[roundIndex][matchIndex];
            
            if (match.winner === winnerTeamNum) {
                match.winner = null;
                propagateWinnerToNextRound(roundIndex, matchIndex, "");
            } else {
                match.winner = winnerTeamNum;
                const winnerName = winnerTeamNum === 1 ? match.team1 : match.team2;
                propagateWinnerToNextRound(roundIndex, matchIndex, winnerName);

                const totalRounds = tournamentData.rounds.length;
                if (roundIndex === totalRounds - 1 && triggerConfettiOnFinal && winnerName) {
                    launchConfetti();
                }
            }

            saveToLocalStorage();
            renderBracket();
        }

        // Advance winner to next round slot
        function propagateWinnerToNextRound(roundIndex, matchIndex, winnerName) {
            const nextRoundIndex = roundIndex + 1;
            if (nextRoundIndex < tournamentData.rounds.length) {
                const nextMatchIndex = Math.floor(matchIndex / 2);
                const nextTeamSlot = (matchIndex % 2 === 0) ? 1 : 2;
                const nextMatch = tournamentData.rounds[nextRoundIndex][nextMatchIndex];

                if (nextTeamSlot === 1) {
                    nextMatch.team1 = winnerName;
                } else {
                    nextMatch.team2 = winnerName;
                }

                if (nextMatch.winner === nextTeamSlot && winnerName === "") {
                    nextMatch.winner = null;
                    propagateWinnerToNextRound(nextRoundIndex, nextMatchIndex, "");
                }
            }
        }

        // Draw curved SVG connector lines
        function drawConnectors() {
            const svg = document.getElementById('connectors-svg');
            const viewport = document.getElementById('bracket-viewport');
            svg.innerHTML = '';
            
            const viewportRect = viewport.getBoundingClientRect();
            svg.setAttribute('width', viewport.scrollWidth);
            svg.setAttribute('height', viewport.scrollHeight);

            const rounds = tournamentData.rounds;

            for (let r = 0; r < rounds.length - 1; r++) {
                const currentRoundMatches = rounds[r];

                currentRoundMatches.forEach((match, mIndex) => {
                    const currentCard = document.getElementById(`card_${match.id}`);
                    const nextMatchIndex = Math.floor(mIndex / 2);
                    const nextMatchId = rounds[r + 1][nextMatchIndex].id;
                    const nextCard = document.getElementById(`card_${nextMatchId}`);

                    if (currentCard && nextCard) {
                        const card1Rect = currentCard.getBoundingClientRect();
                        const card2Rect = nextCard.getBoundingClientRect();

                        const x1 = card1Rect.right - viewportRect.left + viewport.scrollLeft;
                        const y1 = card1Rect.top + card1Rect.height / 2 - viewportRect.top + viewport.scrollTop;

                        const x2 = card2Rect.left - viewportRect.left + viewport.scrollLeft;
                        const y2 = card2Rect.top + card2Rect.height / 2 - viewportRect.top + viewport.scrollTop;

                        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                        const midX = x1 + (x2 - x1) / 2;

                        const d = `M ${x1} ${y1} C ${midX} ${y1}, ${midX} ${y2}, ${x2} ${y2}`;
                        path.setAttribute('d', d);
                        path.setAttribute('class', `connector-line ${match.winner ? 'active' : ''}`);

                        svg.appendChild(path);
                    }
                });
            }
        }

        window.addEventListener('resize', () => drawConnectors());

        document.getElementById('tournament-name').addEventListener('input', (e) => {
            tournamentData.title = e.target.value;
            saveToLocalStorage();
        });

        // Shuffle Seeds
        function shuffleParticipants() {
            if (!confirm("¿Deseas mezclar aleatoriamente el orden de las semillas en la primera ronda? Esto reiniciará los marcadores.")) return;

            let firstRoundParticipants = [];
            tournamentData.rounds[0].forEach(m => {
                if (m.team1) firstRoundParticipants.push(m.team1);
                if (m.team2) firstRoundParticipants.push(m.team2);
            });

            for (let i = firstRoundParticipants.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [firstRoundParticipants[i], firstRoundParticipants[j]] = [firstRoundParticipants[j], firstRoundParticipants[i]];
            }

            initDefaultTournament(tournamentData.size, firstRoundParticipants);
        }

        // Reset Scores & Winners
        function resetScores() {
            if (!confirm("¿Seguro que deseas borrar todos los marcadores y ganadores manteniendo los equipos iniciales?")) return;

            tournamentData.rounds.forEach((round, rIndex) => {
                round.forEach((match) => {
                    match.score1 = "";
                    match.score2 = "";
                    match.winner = null;
                    if (rIndex > 0) {
                        match.team1 = "";
                        match.team2 = "";
                    }
                });
            });

            saveToLocalStorage();
            renderBracket();
        }

        // Export Tournament State as formatted JSON
        function exportJSON() {
            saveToLocalStorage();
            const jsonFormatted = JSON.stringify(tournamentData, null, 2);
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(jsonFormatted);
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `${tournamentData.title.replace(/\s+/g, '_')}_bracket.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        // Import Tournament State from File
        function importJSONPrompt() {
            document.getElementById('file-input').click();
        }

        function handleFileImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (importedData && importedData.rounds) {
                        tournamentData = importedData;
                        document.getElementById('tournament-name').value = tournamentData.title || "Torneo de Campeones 2026";
                        saveToLocalStorage();
                        renderBracket();
                        renderRoundNavTabs();
                        alert("¡Estado del torneo en JSON cargado correctamente!");
                    } else {
                        alert("El archivo JSON no posee una estructura de torneo válida.");
                    }
                } catch(err) {
                    alert("Error al leer el archivo JSON.");
                }
            };
            reader.readAsText(file);
        }

        // Modal Handlers
        function openNewTournamentModal() {
            document.getElementById('new-tournament-modal').classList.add('active');
        }

        function closeNewTournamentModal() {
            document.getElementById('new-tournament-modal').classList.remove('active');
        }

        function generateNewTournament() {
            const size = parseInt(document.getElementById('size-select').value);
            const textareaValue = document.getElementById('participants-textarea').value;
            const participants = textareaValue.split('\n').filter(line => line.trim() !== '');

            initDefaultTournament(size, participants);
            closeNewTournamentModal();
        }

        // Canvas Confetti Celebration
        function launchConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const pieces = [];
            const numberOfPieces = 160;
            const colors = ['#f59e0b', '#6366f1', '#06b6d4', '#10b981', '#ec4899', '#ffffff'];

            for (let i = 0; i < numberOfPieces; i++) {
                pieces.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    speed: Math.random() * 4 + 2,
                    rotation: Math.random() * 360,
                    rotationSpeed: Math.random() * 10 - 5
                });
            }

            let animationFrameId;

            function updateAndDraw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                pieces.forEach(p => {
                    p.y += p.speed;
                    p.rotation += p.rotationSpeed;

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.rotation * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    ctx.restore();
                });

                if (pieces.some(p => p.y < canvas.height)) {
                    animationFrameId = requestAnimationFrame(updateAndDraw);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    cancelAnimationFrame(animationFrameId);
                }
            }

            updateAndDraw();
        }

        // App Initialization
        window.addEventListener('DOMContentLoaded', () => {
            if (!loadFromLocalStorage()) {
                initDefaultTournament(32);
            }
        });
    </script>
</body>
